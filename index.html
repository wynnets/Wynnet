<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>wynnets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#000;--card:#090909;--tx:#ececec;--mu:#74746d;--ac:#c8ff3d;--bd:#1d1d1d;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--tx);font:15px/1.45 'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:460px;margin:0 auto;padding:30px 18px 70px}
h1{margin:0 0 8px;font-size:36px;font-weight:600;letter-spacing:-.035em}
h1::after{content:'.';color:var(--ac)}
p.s{color:var(--mu);margin:0 0 20px;font-size:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:10px}
input,textarea{width:100%;padding:11px 0;margin:2px 0 12px;border:0;border-bottom:1px solid #2a2a2a;border-radius:0;background:transparent;color:var(--tx);font:inherit;outline:0}
input:focus,textarea:focus{border-bottom-color:var(--ac)}
input::placeholder,textarea::placeholder{color:#55554f}
textarea{resize:none}
button{background:var(--ac);color:#000;border:0;border-radius:4px;padding:12px 16px;font:600 14px 'Inter Tight',system-ui,sans-serif;cursor:pointer;width:100%;margin-top:6px}
button:active{transform:translateY(1px)}
button.g{background:none;color:var(--mu);width:auto;padding:4px 0;font-weight:500}
button.g:hover{color:var(--tx)}
small{font:11px var(--mono)}
.e{color:#ff5d5d;font:12px var(--mono);min-height:16px}
.ok{color:var(--ac);font:12px var(--mono)}
.tabs{display:flex;gap:24px;margin:0 0 24px;border-bottom:1px solid var(--bd)}
.tabs button{width:auto;background:none;color:var(--mu);margin:0 0 -1px;padding:10px 0;border-radius:0;border-bottom:2px solid transparent;font:500 12px var(--mono);letter-spacing:.02em}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
.row{display:flex;gap:12px;align-items:center}
.hd{margin-bottom:22px}
.brand{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-bottom:18px}.brand::after{content:'.';color:var(--ac)}
.av{border-radius:50%;background:#141414;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;object-fit:cover;flex:none;color:var(--tx);font-weight:600}
.sr{padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.sr:hover{background:var(--card)}
.ch{cursor:pointer}.ch:hover{border-color:#3a3a3a}
.b{padding:9px 12px;margin:8px 0;max-width:82%;border:1px solid var(--bd);border-radius:2px 14px 14px 14px;background:#0d0d0d}
.b.me{margin-left:auto;background:var(--tx);color:#000;border-color:var(--tx);border-radius:14px 2px 14px 14px}
.b small{display:block;margin-top:4px;font-size:10px;color:var(--mu)}
.b.me small{color:#555}
.fb{border:1px solid #2a2a2a;padding:8px 12px;border-radius:4px;cursor:pointer;font:12px var(--mono)}
.fb:hover{border-color:var(--ac)}
</style></head><body><div class="w" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='YOUR-PROJECT-URL',SUPABASE_KEY='YOUR-ANON-KEY';
const $=s=>document.querySelector(s),app=$('#app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=u=>u.trim().replace(/^@/,'').toLowerCase();
let sb,P=null,tab='search',cur=null,shown=null,newAv=null,th=[],msgs=[],poll=null,st;
const av=(p,z)=>{const s=`width:${z}px;height:${z}px`;return p&&p.avatar?`<img class="av" style="${s}" src="${esc(p.avatar)}">`:`<div class="av" style="${s}">${p&&p.username?esc(p.username[0].toUpperCase()):'?'}</div>`};
const dn=p=>p.nick||'@'+p.username;
const ttl=t=>t.kind==='out'?dn({nick:t.peer_nick,username:t.peer_username}):'Anonymous #'+t.anon_no;
async function boot(){
 if(SUPABASE_URL.includes('YOUR-')){app.innerHTML='<h1>wynnets</h1><p class="s">Setup needed: put your Supabase URL and anon key at the top of index.html (see README.md).</p>';return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const{data}=await sb.auth.getSession();data.session?load():loginView();
}
async function load(){
 const{data:{user}}=await sb.auth.getUser();
 const{data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(!data){await sb.auth.signOut();return loginView()}
 P=data;home();
}
function loginView(err){
 app.innerHTML=`<h1>wynnets</h1><p class="s">anonymous messages. no names, just usernames.</p>
 <div class="c"><b>Create a username and password</b>
 <input id="u" placeholder="@username" autocapitalize="off" autocomplete="off">
 <input id="p" type="password" placeholder="Password">
 <div class="e" id="e">${err||''}</div><button id="go">Enter</button>
 <p class="s" style="margin:10px 0 0;font-size:13px">If the username is taken, it can't be claimed. Already yours? Enter it with your password to log back in.</p></div>`;
 $('#go').onclick=enter;
}
async function enter(){
 const e=$('#e'),n=norm($('#u').value),p=$('#p').value;
 if(!n||!p){e.textContent='Enter a username and a password.';return}
 if(n.length>30||/[\s@]/.test(n)){e.textContent='Username: up to 30 characters, no spaces or @.';return}
 if(p.length<6){e.textContent='Password must be at least 6 characters.';return}
 e.textContent='…';
 const{data:em}=await sb.rpc('login_email',{p_username:n});
 if(em){const{error}=await sb.auth.signInWithPassword({email:em,password:p});if(error){e.textContent='@'+n+' is already taken.';return}}
 else{
  const email='u'+[...new TextEncoder().encode(n)].map(b=>b.toString(16).padStart(2,'0')).join('')+'@wynnets.app';
  const{data,error}=await sb.auth.signUp({email,password:p});
  if(error||!data.session){e.textContent=error?error.message:'Turn off "Confirm email" in Supabase Auth settings.';return}
  const r=await sb.from('profiles').insert({id:data.user.id,username:n});
  if(r.error){await sb.auth.signOut();e.textContent='@'+n+' is already taken.';return}
 }
 load();
}
function home(){
 app.innerHTML=`<div class="brand">wynnets</div><div class="row hd" id="hd"></div>
 <div class="tabs"><button id="t0">edit profile</button><button id="t1">search</button><button id="t2">my chats</button></div>
 <div id="p0" hidden><div class="c"><div class="row"><div id="pav"></div><label class="fb">Change photo<input type="file" id="pf" accept="image/*" hidden></label></div>
  <small style="color:var(--mu)">Nickname</small><input id="pn" maxlength="30" placeholder="Nickname" autocomplete="off">
  <small style="color:var(--mu)">Username</small><input id="pu" maxlength="30" placeholder="@username" autocapitalize="off" autocomplete="off">
  <div class="e" id="pe"></div><button id="ps">Save</button><button class="g" id="out" style="margin-top:12px">Log out</button></div></div>
 <div id="p1"><input id="q" placeholder="Search people" autocomplete="off"><div id="res"></div></div>
 <div id="p2" hidden><div id="chats"></div></div>`;
 $('#out').onclick=async()=>{clearInterval(poll);await sb.auth.signOut();P=null;cur=null;shown=null;th=[];loginView()};
 $('#q').oninput=()=>{clearTimeout(st);st=setTimeout(search,250)};
 ['profile','search','chats'].forEach((n,i)=>$('#t'+i).onclick=()=>setTab(n));
 $('#pf').onchange=pickAv;$('#ps').onclick=saveProfile;
 clearInterval(poll);poll=setInterval(refresh,4000);
 hdr();setTab(tab);
}
function hdr(){$('#hd').innerHTML=`${av(P,44)}<div><b>${esc(dn(P))}</b><br><small style="color:var(--mu)">@${esc(P.username)}</small></div>`}
function setTab(t){tab=t;$('#p0').hidden=t!=='profile';$('#p1').hidden=t!=='search';$('#p2').hidden=t!=='chats';
 ['profile','search','chats'].forEach((n,i)=>$('#t'+i).className=t===n?'on':'');
 if(t==='profile'){newAv=null;$('#pn').value=P.nick||'';$('#pu').value=P.username;$('#pe').textContent='';$('#pav').innerHTML=av(P,64)}
 if(t==='chats')refresh();
}
function pickAv(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),m=Math.min(im.width,im.height);
  x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,96,96);newAv=c.toDataURL('image/jpeg',.8);$('#pav').innerHTML=`<img class="av" style="width:64px;height:64px" src="${newAv}">`};im.src=r.result};r.readAsDataURL(f)}
async function saveProfile(){
 const pe=$('#pe');pe.className='e';const nick=$('#pn').value.trim().slice(0,30),n=norm($('#pu').value);
 if(!n||n.length>30||/[\s@]/.test(n)){pe.textContent='Username: up to 30 characters, no spaces or @.';return}
 const r=await sb.from('profiles').update({username:n,nick,avatar:newAv!==null?newAv:P.avatar}).eq('id',P.id).select().single();
 if(r.error){pe.textContent=r.error.code==='23505'?'@'+n+' is already taken.':'Error: '+r.error.message;return}
 P=r.data;hdr();pe.className='ok';pe.textContent='Saved ✓';
}
async function search(){
 const q=norm($('#q').value).replace(/[,()%*\\]/g,''),r=$('#res');if(!q){r.innerHTML='';return}
 const{data}=await sb.from('profiles').select('id,username,nick,avatar').neq('id',P.id).or(`username.ilike.%${q}%,nick.ilike.%${q}%`).limit(10);
 const h=data||[];
 r.innerHTML=h.length?h.map((p,i)=>`<div class="row sr" data-i="${i}">${av(p,40)}<div><b>${esc(dn(p))}</b><br><small style="color:var(--mu)">@${esc(p.username)}</small></div></div>`).join(''):'<p class="s">Nobody found.</p>';
 r.querySelectorAll('.sr').forEach(x=>x.onclick=async()=>{const p=h[x.dataset.i];await loadThreads();
  const t=th.find(t=>t.kind==='out'&&t.peer_username===p.username);cur=t?{id:t.thread_id,t}:{id:null,t:{kind:'out',peer_username:p.username,peer_nick:p.nick,peer_avatar:p.avatar}};shown=null;setTab('chats')});
}
async function loadThreads(){const{data}=await sb.rpc('my_threads');th=data||[]}
async function refresh(){
 if(tab!=='chats'||!P)return;await loadThreads();
 if(cur&&cur.id){const r=await sb.rpc('thread_messages',{p_thread:cur.id});msgs=r.data||[];const t=th.find(t=>t.thread_id===cur.id);if(t)cur.t=t}
 chats();
}
const tav=t=>t.kind==='out'?av({username:t.peer_username,avatar:t.peer_avatar},40):'<div class="av" style="width:40px;height:40px">?</div>';
function chats(){
 if(tab!=='chats')return;const box=$('#chats');
 if(cur){const k=cur.id||'new:'+cur.t.peer_username;
  if(shown!==k){shown=k;box.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="g" id="bk">← Back</button>${tav(cur.t)}<b>${esc(ttl(cur.t))}</b></div>
   <div class="c"><div id="msgs"></div><textarea id="t" rows="2" maxlength="500" placeholder="${cur.t.kind==='out'?'Write anonymously…':'Reply anonymously…'}"></textarea><div class="e" id="se"></div><button id="sb">Send</button></div>`;
   $('#bk').onclick=()=>{cur=null;shown=null;msgs=[];chats()};$('#sb').onclick=send}
  const m=cur.id?msgs:[];
  $('#msgs').innerHTML=m.length?m.map(x=>`<div class="b ${x.mine?'me':''}">${esc(x.body)}<br><small>${x.mine?'You':esc(ttl(cur.t))} · ${new Date(x.created_at).toLocaleString()}</small></div>`).join(''):'<p class="s">No messages yet. Say something!</p>';
  return}
 shown=null;
 box.innerHTML=th.length?th.map((t,i)=>`<div class="c row ch" data-i="${i}">${tav(t)}<div><b>${esc(ttl(t))}</b><br><small style="color:var(--mu)">${esc((t.last_body||'New chat').slice(0,50))}</small></div></div>`).join(''):'<p class="s">No chats yet. Use search to message someone.</p>';
 box.querySelectorAll('.ch').forEach(x=>x.onclick=()=>{const t=th[x.dataset.i];cur={id:t.thread_id,t};msgs=[];chats();refresh()});
}
async function send(){
 const v=$('#t').value.trim();if(!v)return;
 const{data,error}=await sb.rpc('send_message',{p_username:cur.id?null:cur.t.peer_username,p_thread:cur.id,p_body:v});
 if(error){$('#se').textContent='Could not send.';return}
 if(!cur.id){cur.id=data;shown=cur.id}$('#t').value='';refresh();
}
boot();
</script></body></html>
